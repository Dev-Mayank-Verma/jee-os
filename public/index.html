function ds(d){d=d||new Date();var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function addD(n){var d=new Date();d.setDate(d.getDate()+n);return ds(d)}
function days(a){return Math.ceil((new Date(a+"T00:00:00")-new Date(ds()+"T00:00:00"))/864e5)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function lastN(n){var o=[],d=new Date();for(var i=0;i<n;i++){o.push(ds(d));d.setDate(d.getDate()-1)}return o}
function logOf(k){return S.logs[k]||{ph:0,ch:0,ma:0,co:0,lec:0,pm:0,note:""}}
function wk(f){return lastN(7).reduce(function(a,k){return a+(+logOf(k)[f]||0)},0)}
function hrs(k){var l=logOf(k);return (+l.ph||0)+(+l.ch||0)+(+l.ma||0)+(+l.co||0)}
function streak(){var n=0,d=new Date();for(var i=0;i<400;i++){var k=ds(d),c=S.checks[k]||{},a=hrs(k)>0||(logOf(k).lec>0)||Object.keys(c).filter(function(x){return c[x]}).length>=3;if(a)n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}
function cpct(c){return Math.round((c.lt?Math.min(1,c.ld/c.lt):0)*40+(c.dt?Math.min(1,c.dd/c.dt):0)*20+(c.pt?Math.min(1,c.pd/c.pt):0)*15+(c.n?10:0)+Math.min(c.r,3)/3*15)}
function gpct(g){var k=Object.keys(S.jee[g]||{});if(!k.length)return 0;return Math.round(k.reduce(function(a,c){return a+cpct(S.jee[g][c])},0)/k.length)}
function tots(){var t={lec:0,dpp:0,rev:0,pyq:0,ch:0,done:0};for(var g in S.jee)for(var c in S.jee[g]){var o=S.jee[g][c];t.lec+=o.ld;t.dpp+=o.dd;t.pyq+=o.pd;t.rev+=o.r;t.ch++;if(cpct(o)>=90)t.done++}return t}
function xp(){var t=tots(),ck=0;for(var k in S.checks)for(var i in S.checks[k])if(S.checks[k][i])ck++;var pm=0;for(var d in S.logs)pm+=+S.logs[d].pm||0;
return t.lec*10+t.dpp*2+t.pyq*3+t.rev*30+ck*5+pm*15+S.mocks.length*50+S.mist.length*4}
function lvl(){var x=xp(),l=Math.floor(Math.sqrt(x/40))+1,a=40*(l-1)*(l-1),b=40*l*l;return{l:l,x:x,p:Math.round((x-a)/(b-a)*100),n:b-x}}
function dueList(){var o=[];for(var g in S.jee)for(var c in S.jee[g]){var v=S.jee[g][c];if(v.r>0&&v.r<4&&v.rd&&v.rd<=ds())o.push([g,c,v])}return o}

return h+'<div class="card"><h2>Josh</h2><b>'+esc(QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length])+'</b><div class="small" style="margin-top:8px">WHY: '+esc(S.why)+'</div></div>'}
